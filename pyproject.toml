[build-system]
# Needed only to build or install the package; LogMasque itself uses the
# standard library alone.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logmasque"
dynamic = ["version"]
description = "Local-first log collection and reversible data sanitization for technical support."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheSilentD3ath" }]
keywords = ["logs", "anonymization", "pseudonymization", "redaction", "privacy", "support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.scripts]
logmasque = "logmasque.cli:main"

[tool.setuptools]
packages = ["logmasque"]

[tool.setuptools.dynamic]
version = { attr = "logmasque.__version__" }

[tool.setuptools.package-data]
logmasque = ["web/*.html", "web/*.css", "web/*.js"]
